<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-header pageTitle="Our Fleet" backHref="/home"></app-header>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-light">
  <div class="cars-container">
    <div class="header-text">
      <h2>Travel in Comfort</h2>
      <p>Choose from our wide range of premium vehicles</p>
    </div>
    
    <div class="grid-container" *ngIf="cars$ | async as cars; else loading">
      <app-car-card *ngFor="let car of cars"
        [image]="car.image"
        [name]="car.name"
        [type]="car.type"
        [seats]="car.seats"
        [hasAc]="car.hasAc"
        [price]="car.price"
        [description]="car.description"
        [suitableFor]="car.suitableFor">
      </app-car-card>
    </div>

    <ng-template #loading>
      <div class="loading-spinner">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
      </div>
    </ng-template>
  </div>
</ion-content>
