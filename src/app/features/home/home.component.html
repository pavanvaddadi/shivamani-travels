<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-header></app-header>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Discover the Beauty of <br/><span class="highlight">Andhra Pradesh</span></h1>
      <p class="hero-subtitle">Premium travel experiences with Shivamani Travels</p>
    </div>
  </div>

  <!-- Search Card -->
  <app-search-card></app-search-card>

  <!-- Popular Destinations -->
  <div class="section-container mt-4">
    <div class="section-header">
      <h2 class="section-title">Popular Destinations</h2>
      <ion-button fill="clear" color="primary" routerLink="/trips">See All</ion-button>
    </div>
    <div class="horizontal-scroll">
      <app-trip-card *ngFor="let dest of popularDestinations"
        [image]="dest.image"
        [title]="dest.title"
        [subtitle]="dest.subtitle"
        [price]="dest.price">
      </app-trip-card>
    </div>
  </div>

  <!-- Featured Cars -->
  <div class="section-container">
    <div class="section-header">
      <h2 class="section-title">Featured Cars</h2>
      <ion-button fill="clear" color="primary" routerLink="/cars">See All</ion-button>
    </div>
    <div class="horizontal-scroll">
      <app-car-card *ngFor="let car of featuredCars"
        [image]="car.image"
        [name]="car.name"
        [type]="car.type"
        [seats]="car.seats"
        [hasAc]="car.hasAc"
        [price]="car.price"
        [description]="car.description"
        [suitableFor]="car.suitableFor">
      </app-car-card>
    </div>
  </div>

  <!-- Tour Packages -->
  <div class="section-container mb-4">
    <div class="section-header">
      <h2 class="section-title">Exclusive Packages</h2>
      <ion-button fill="clear" color="primary" routerLink="/trips">See All</ion-button>
    </div>
    <div class="grid-container">
      <app-trip-card *ngFor="let pkg of tourPackages"
        [image]="pkg.image"
        [title]="pkg.title"
        [subtitle]="pkg.subtitle"
        [price]="pkg.price"
        [description]="pkg.description">
      </app-trip-card>
    </div>
  </div>

  <!-- Wedding Services -->
  <div class="section-container mb-4">
    <div class="section-header">
      <h2 class="section-title">Wedding & Event Decorations</h2>
    </div>
    <div class="grid-container" *ngIf="weddingServices$ | async as services">
      <app-trip-card *ngFor="let srv of services"
        [image]="srv.image"
        [title]="srv.title"
        [subtitle]="srv.subtitle"
        [price]="srv.price"
        [description]="srv.description">
      </app-trip-card>
    </div>
  </div>

  <!-- Footer Links -->
  <div class="footer-section">
    <div class="footer-links">
      <ion-button fill="clear" color="medium" routerLink="/about">About Us</ion-button>
      <ion-button fill="clear" color="medium" routerLink="/contact">Contact</ion-button>
    </div>
    <p class="copyright">&copy; 2026 Shivamani Travels. All rights reserved.</p>
  </div>

  <!-- WhatsApp CTA FAB -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="whatsapp-fab" (click)="openWhatsApp()" aria-label="Chat on WhatsApp">
      <!-- Official WhatsApp SVG icon — inline so it always renders -->
      <svg class="wa-fab-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="16" fill="#25D366"/>
        <path fill="#ffffff" d="M23.5 8.5A10.9 10.9 0 0016 6C10.48 6 6 10.48 6 16a9.94 9.94 0 001.36 5.09L6 26l5.09-1.34A10 10 0 0016 26c5.52 0 10-4.48 10-10a9.93 9.93 0 00-2.5-7.5zm-7.5 15.3a8.28 8.28 0 01-4.22-1.15l-.3-.18-3.12.82.83-3.04-.2-.32A8.27 8.27 0 017.7 16a8.3 8.3 0 018.3-8.3 8.3 8.3 0 010 16.6zm4.56-6.2c-.25-.12-1.47-.72-1.7-.81-.22-.08-.39-.12-.55.12s-.63.81-.77.97-.28.19-.52.06a6.55 6.55 0 01-1.93-1.19 7.23 7.23 0 01-1.34-1.66c-.14-.25-.01-.38.1-.5.11-.11.25-.28.37-.42.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 00-.65.31 2.76 2.76 0 00-.86 2.05 4.8 4.8 0 001 2.55 11 11 0 004.2 3.72c.59.25 1.04.4 1.4.51.59.19 1.12.16 1.54.1.47-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.1-.22-.16-.47-.28z"/>
      </svg>
    </ion-fab-button>
  </ion-fab>
</ion-content>
