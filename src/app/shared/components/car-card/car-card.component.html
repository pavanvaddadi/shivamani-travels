<ion-card class="premium-card">
  <img [src]="image" (error)="image = 'assets/images/placeholder.jpg'" [alt]="name" class="card-image" loading="lazy"/>
  <ion-card-header>
    <ion-card-subtitle>
      {{ type }}
      <span *ngIf="suitableFor" class="dot-separator">•</span>
      <span *ngIf="suitableFor" class="suitable-for">{{ suitableFor }}</span>
    </ion-card-subtitle>
    <div class="title-row">
      <ion-card-title>{{ name }}</ion-card-title>
      <span *ngIf="price" class="price-tag">{{ price }}</span>
    </div>
  </ion-card-header>
  <ion-card-content class="card-content">
    <p *ngIf="description" class="car-description">{{ description }}</p>
    <div class="features">
      <div class="feature">
        <!-- People SVG -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="#007c4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="7" r="4" stroke="#007c4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="#007c4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ seats }} Seats</span>
      </div>
      <div class="feature">
        <!-- AC / snowflake SVG -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"
                stroke="#007c4b" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="2" fill="#007c4b"/>
        </svg>
        <span>{{ hasAc ? 'AC' : 'Non-AC' }}</span>
      </div>
    </div>
    <ion-button expand="block" color="primary" class="book-btn" routerLink="/booking" [queryParams]="{ item: name }">
      Book Now
    </ion-button>
  </ion-card-content>
</ion-card>
