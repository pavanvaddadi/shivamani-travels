<div class="search-card-container">
  <ion-card class="search-card">
    <ion-card-content>
      <div class="search-fields">
        <ion-item lines="none" class="input-item">
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-input label="Pickup Location" labelPlacement="floating" placeholder="Where are you?"></ion-input>
        </ion-item>
        <div class="divider"></div>
        <ion-item lines="none" class="input-item">
          <ion-icon name="map-outline" slot="start" color="primary"></ion-icon>
          <ion-input label="Destination" labelPlacement="floating" placeholder="Where to?"></ion-input>
        </ion-item>
      </div>
      <ion-button expand="block" shape="round" color="primary" class="search-btn" routerLink="/trips">
        <ion-icon name="search-outline" slot="start"></ion-icon>
        Search Trips
      </ion-button>
    </ion-card-content>
  </ion-card>
</div>
