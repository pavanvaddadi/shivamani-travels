<div class="search-card-container">
  <ion-card class="search-card">
    <ion-card-content>
      <div class="search-card-title">
        <!-- Map pin SVG -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
                stroke="#007c4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="9" r="2.5" stroke="#007c4b" stroke-width="2"/>
        </svg>
        Plan Your Journey
      </div>

      <div class="search-fields">
        <!-- Pickup -->
        <div class="field-row">
          <div class="field-icon pickup-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="#007c4b" stroke-width="2"/>
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke="#007c4b" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="field-content">
            <label class="field-label">Pickup Location</label>
            <ion-input
              class="field-input"
              placeholder="Where are you?"
              aria-label="Pickup Location">
            </ion-input>
          </div>
        </div>

        <div class="field-divider">
          <div class="divider-line"></div>
          <!-- Arrow SVG -->
          <svg class="divider-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12l7 7 7-7" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="divider-line"></div>
        </div>

        <!-- Destination -->
        <div class="field-row">
          <div class="field-icon dest-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
                    stroke="#007c4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="9" r="2.5" fill="#007c4b"/>
            </svg>
          </div>
          <div class="field-content">
            <label class="field-label">Destination</label>
            <ion-input
              class="field-input"
              placeholder="Where to?"
              aria-label="Destination">
            </ion-input>
          </div>
        </div>
      </div>

      <ion-button expand="block" color="primary" class="search-btn" routerLink="/trips">
        <svg slot="start" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        Search Trips
      </ion-button>
    </ion-card-content>
  </ion-card>
</div>
